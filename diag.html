<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>滚动诊断 · 皮克学英语</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 -apple-system, system-ui, sans-serif; color: #222; background: #fafafa; }
  .wrap { padding: 12px 12px 40px; }
  h1 { font-size: 17px; margin: 0 0 8px; }
  .hint { background: #fff3cd; border: 1px solid #ffe08a; padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #111; color: #4ade80; padding: 10px; border-radius: 8px; font-size: 12px; margin: 0 0 10px; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; margin: 0 6px 8px 0; }
  #log { font-size: 13px; color: #b45309; font-weight: 700; margin-bottom: 8px; }
  .filler { height: 170px; border: 1px dashed #bbb; border-radius: 8px; margin: 8px 0;
            display: flex; align-items: center; justify-content: center; color: #666;
            background: repeating-linear-gradient(45deg, #ececec, #ececec 12px, #f7f7f7 12px, #f7f7f7 24px); }
</style>
</head>
<body>
<div class="wrap">
  <h1>滚动诊断</h1>
  <div class="hint">请把下面黑框里的内容<b>截图</b>或点「复制结果」发给我。</div>
  <pre id="out">collecting…</pre>
  <button id="copy">复制结果</button>
  <button id="auto">自动滚到 300px</button>
  <div id="log"></div>
  <div class="filler">往下滚 1</div>
  <div class="filler">往下滚 2</div>
  <div class="filler">往下滚 3</div>
  <div class="filler">往下滚 4</div>
  <div class="filler">往下滚 5 · 到底了</div>
</div>
<script>
(function () {
  function probeEnv(name) {
    var d = document.createElement('div');
    d.style.cssText = 'position:absolute;left:-9999px;top:0;width:1px;height:1px;';
    d.style.bottom = 'env(' + name + ', 0px)';
    document.body.appendChild(d);
    var v = getComputedStyle(d).bottom;
    d.remove();
    return v;
  }
  function fixedLayers() {
    var out = [];
    document.querySelectorAll('body *').forEach(function (n) {
      var s = getComputedStyle(n), r = n.getBoundingClientRect();
      if ((s.position === 'fixed' || s.position === 'absolute') &&
          r.height > innerHeight * 0.7 && r.width > innerWidth * 0.7) {
        out.push(n.tagName + '.' + String(n.className).slice(0, 24) +
                 '(pe=' + s.pointerEvents + ',z=' + s.zIndex + ')');
      }
    });
    return out.length ? out.join(' | ') : 'none';
  }
  function centerEl() {
    var el = document.elementFromPoint(innerWidth / 2, innerHeight / 2);
    return el ? (el.tagName + '.' + String(el.className).slice(0, 30) +
                 ' pe=' + getComputedStyle(el).pointerEvents) : 'null';
  }
  function collect() {
    var de = document.documentElement, b = document.body;
    var cDe = getComputedStyle(de), cB = getComputedStyle(b);
    var vv = window.visualViewport;
    return [
      'UA: ' + navigator.userAgent,
      '',
      'screen: ' + screen.width + 'x' + screen.height + '   dpr=' + devicePixelRatio,
      'innerW x innerH: ' + innerWidth + ' x ' + innerHeight,
      'visualViewport: ' + (vv ? Math.round(vv.width) + ' x ' + Math.round(vv.height) + '  scale=' + vv.scale : 'n/a'),
      '',
      'doc.scrollHeight: ' + de.scrollHeight,
      'body.scrollHeight: ' + b.scrollHeight,
      '>>> MAX SCROLL: ' + (de.scrollHeight - innerHeight),
      'scrollY: ' + window.scrollY,
      '',
      'html overflow x/y: ' + cDe.overflowX + ' / ' + cDe.overflowY,
      'body overflow x/y: ' + cB.overflowX + ' / ' + cB.overflowY,
      'html overscroll-behavior-y: ' + cDe.overscrollBehaviorY,
      'body min-height: ' + cB.minHeight,
      '',
      'env(safe-area-inset-bottom): ' + probeEnv('safe-area-inset-bottom'),
      'env(safe-area-max-inset-bottom): ' + probeEnv('safe-area-max-inset-bottom'),
      '',
      'fixed full-screen layers: ' + fixedLayers(),
      'center element: ' + centerEl()
    ].join('\n');
  }
  var out = document.getElementById('out');
  var log = document.getElementById('log');
  function render() { out.textContent = collect(); }
  render();
  window.addEventListener('scroll', function () { log.textContent = 'scrollY = ' + window.scrollY; }, { passive: true });
  document.getElementById('auto').onclick = function () { window.scrollTo(0, 300); setTimeout(render, 400); };
  document.getElementById('copy').onclick = function () {
    var t = collect();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(t).then(
        function () { log.textContent = '已复制到剪贴板'; },
        function () { log.textContent = '复制失败，请手动截图'; });
    } else { log.textContent = '复制失败，请手动截图'; }
  };
})();
</script>
</body>
</html>
