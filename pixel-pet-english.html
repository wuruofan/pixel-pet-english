<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff8ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>皮克学英语 · Pixel Pet English</title>
<style>
:root {
  --bg: #fff8ef;
  --bg-2: #ffeed8;
  --card: #ffffff;
  --ink: #3a2c22;
  --ink-soft: #8b7663;
  --line: #f0e2cf;
  --brand: #ff8a3d;
  --brand-dk: #f26a12;
  --green: #38c07e;
  --green-dk: #1fa268;
  --blue: #4aa8ff;
  --purple: #a06bff;
  --pink: #ff6f91;
  --red: #f2544b;
  --yellow: #ffc445;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --shadow: 0 4px 0 rgba(58, 44, 34, .08), 0 10px 26px rgba(58, 44, 34, .09);
  --shadow-lift: 0 8px 0 rgba(58, 44, 34, .10), 0 18px 34px rgba(58, 44, 34, .14);
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  overscroll-behavior-y: none;
  /* 摇晃提示用 rotate/translate，旋转会把卡片包围盒撑大、探出视口，
     导致临时出现横/竖向滚动条。横向裁掉即可（竖向滚动照常）；
     竖向撑高很小、落在卡片底部留白内，不会触发竖向滚动条。 */
  overflow-x: hidden;
}

body {
  background:
    radial-gradient(1100px 520px at 12% -8%, #ffe6c2 0%, transparent 60%),
    radial-gradient(900px 480px at 100% 0%, #ffe0ec 0%, transparent 55%),
    var(--bg);
  min-height: 100vh;
}

#app { max-width: 860px; margin: 0 auto; padding: 14px 14px 108px; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 4px 12px;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 19px; letter-spacing: .3px; }
.brand .logo { font-size: 26px; }
.topbar .spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 2px solid var(--line);
  border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 800;
  box-shadow: 0 2px 0 rgba(58,44,34,.06);
  white-space: nowrap;
}
.pill .n { color: var(--brand-dk); }

/* ---------- tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center; gap: 6px;
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, .93);
  backdrop-filter: blur(12px);
  border-top: 2px solid var(--line);
}
.tab {
  flex: 0 1 92px; border: 0; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border-radius: 14px; color: var(--ink-soft);
  font-family: var(--font); font-size: 11px; font-weight: 800;
  transition: transform .12s;
}
.tab .ic { font-size: 22px; line-height: 1; filter: grayscale(1) opacity(.45); }
.tab.on { color: var(--brand-dk); background: #fff1e2; }
.tab.on .ic { filter: none; transform: translateY(-1px) scale(1.06); }
.tab:active { transform: scale(.94); }

/* ---------- cards ---------- */
.card {
  background: var(--card); border: 2px solid var(--line);
  border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.card.tight { padding: 12px; }

h2.section { font-size: 15px; margin: 0 0 10px; color: var(--ink-soft); font-weight: 900; letter-spacing: .4px; }

.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

/* ---------- buttons ---------- */
.btn {
  border: 0; cursor: pointer; font-family: var(--font); font-weight: 900;
  border-radius: 999px; padding: 12px 20px; font-size: 16px;
  background: var(--brand); color: #fff;
  box-shadow: 0 4px 0 var(--brand-dk);
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-dk); }
.btn.green { background: var(--green); box-shadow: 0 4px 0 var(--green-dk); }
.btn.green:active { box-shadow: 0 1px 0 var(--green-dk); }
.btn.blue { background: var(--blue); box-shadow: 0 4px 0 #2f8ce0; }
.btn.blue:active { box-shadow: 0 1px 0 #2f8ce0; }
.btn.purple { background: var(--purple); box-shadow: 0 4px 0 #8452e0; }
.btn.purple:active { box-shadow: 0 1px 0 #8452e0; }
.btn.ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 rgba(58,44,34,.08); }
.btn.ghost:active { box-shadow: 0 1px 0 rgba(58,44,34,.08); }
.btn.sm { padding: 8px 14px; font-size: 13px; }
.btn.xs {
  padding: 5px 11px; font-size: 12px; white-space: nowrap;
  box-shadow: 0 3px 0 var(--brand-dk);
}
.btn.xs:active { box-shadow: 0 1px 0 var(--brand-dk); }
.btn.xs.green { box-shadow: 0 3px 0 var(--green-dk); }
.btn.xs.green:active { box-shadow: 0 1px 0 var(--green-dk); }
.btn.xs.blue { box-shadow: 0 3px 0 #2f8ce0; }
.btn.xs.blue:active { box-shadow: 0 1px 0 #2f8ce0; }
.btn.xs.purple { box-shadow: 0 3px 0 #8452e0; }
.btn.xs.purple:active { box-shadow: 0 1px 0 #8452e0; }
.btn.xs.ghost { box-shadow: 0 3px 0 rgba(58,44,34,.08); }
.btn.xs.ghost:active { box-shadow: 0 1px 0 rgba(58,44,34,.08); }
.btn.big { padding: 16px 30px; font-size: 19px; width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  background: none; border: 0; cursor: pointer; font-family: var(--font);
  font-size: 13px; padding: 2px 4px; vertical-align: 2px; opacity: .65;
}
.icon-btn:active { transform: scale(.88); }

/* ---------- pet ---------- */
.pet-wrap { display: flex; gap: 16px; align-items: center; }
.pet-stage {
  position: relative; width: 280px; flex: 0 0 auto;
  height: 220px;
  padding: 28px 14px 14px;
  border-radius: var(--r-lg);
  background: linear-gradient(165deg, #d9f4ff 0%, #ffe9f3 100%);
  border: 2px solid var(--line);
  box-shadow: inset 0 -8px 0 rgba(255,255,255,.6);
}
/* 定位层（JS 驱动走路）与动画层分离：#pet-pos 只管位置/朝向（left/top + scaleX），
   .pet-canvas-wrap 的 transform 全部留给 CSS 动画——表演类 keyframes 不必再手写居中位移。
   此前 hop/chomp/shake 丢了 translate(-50%) 正是「宠物跳到右下角又回来」的根因 */
#pet-pos {
  position: absolute; left: 90px; top: 54px;
  width: 96px; height: 96px;
  transition: left 1.2s ease-in-out, top 1.2s ease-in-out;
}
#pet-pos.face-left { transform: scaleX(-1); }
.pet-canvas-wrap {
  position: relative; width: 100%; height: 100%;
  cursor: pointer;
  animation: pet-idle 2.8s ease-in-out infinite;
}
.pet-canvas-wrap.happy { animation: hop .55s ease; }
.pet-canvas-wrap.eat { animation: chomp .45s ease 2; }
.pet-canvas-wrap.sad { animation: shake .4s ease; }
#pet-cv { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
/* idle 浮动：原居中位移已移入 #pet-pos 的 top（54 = 62-8，略偏上给 stage-name 留空间） */
@keyframes pet-idle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
.float-ico {
  position: absolute; bottom: 60%; left: 30%; font-size: 22px; pointer-events: none;
  animation: float-up 1.05s ease-out forwards;
}
@keyframes float-up {
  0% { opacity: 0; transform: translateY(0) scale(.6); }
  25% { opacity: 1; transform: translateY(-16px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-52px) scale(.9); }
}
.pet-stage-name {
  position: absolute; left: 0; right: 0; bottom: 10px;
  text-align: center;
  font-size: 11px; font-weight: 900; color: var(--ink-soft);
}
.bar.pink > i { background: linear-gradient(90deg, #ff9ec1, #ff5f8f); }
.bar.blue > i { background: linear-gradient(90deg, #9bd0ff, #4aa8ff); }
@keyframes hop { 0%,100%{transform:translateY(0) scale(1)} 35%{transform:translateY(-16px) scale(1.06)} 70%{transform:translateY(0) scale(.97)} }
@keyframes chomp { 0%,100%{transform:scale(1)} 25%{transform:scale(1.18,.86)} 60%{transform:scale(.9,1.14)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px) rotate(-6deg)} 75%{transform:translateX(7px) rotate(6deg)} }
.pet-meta { flex: 1; min-width: 0; }
/* 数值条：一行 = 左侧「标签 + 进度条」撑满一列，右侧照顾按钮纵向拉满同高。
   进度条占满左列整宽，与按钮列对齐。 */
.pet-bars {
  display: flex; flex-direction: column;
  gap: 10px; margin-top: 12px;
  width: 100%;
}
.pet-bars .bar-row {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: "lbl btn" "bar btn";
  align-items: stretch;
  column-gap: 10px; row-gap: 3px;
}
.pet-bars .lbl {
  grid-area: lbl; font-size: 11.5px; font-weight: 900;
  color: var(--ink-soft); white-space: nowrap; line-height: 1.25;
}
.pet-bars .bar { grid-area: bar; width: 100%; }
.pet-bars .btn { grid-area: btn; align-self: stretch; }
/* 末尾统一 hint：进度条下面的"哪种练习得哪种素材"说明 */
.pet-hint {
  width: 100%;
  font-size: 11.5px; font-weight: 800; color: var(--ink-soft);
  text-align: center;
  padding-top: 4px;
  border-top: 1px dashed rgba(240,226,207,.7);
  margin-top: 2px;
}
/* 经验胶囊：Lv 标签 + 经验条合成一个左上角小胶囊，整体只占左侧空间 */
/* 经验条胶囊坐落在 pet-stage 左上 -10px，胶囊内嵌 Lv 小白圆 + 窄经验条 */
.pet-xp {
  position: absolute; top: -10px; left: -10px;
  display: flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 10px 0 4px;
  background: var(--yellow); color: #6b4708;
  border: 2px solid #fff; border-radius: 999px;
  box-shadow: 0 1px 0 rgba(0,0,0,.04);
  z-index: 2;
  font-size: 11px; font-weight: 900;
}
.pet-xp .lvl-mini {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; color: #6b4708;
  font-size: 11px; font-weight: 900;
  border-radius: 999px; padding: 0 7px;
  height: 16px;
}
.pet-xp .bar {
  width: 52px; height: 6px; border-width: 1.5px; margin: 0;
  background: rgba(255,255,255,.6);
}
.pet-xp .bar > i { background: linear-gradient(90deg, #6b4708, #c98a14); }
.pet-name {
  font-size: 20px; font-weight: 900;
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 7px;
}
.pet-say {
  font-size: 12.5px; font-weight: 700; color: var(--ink-soft);
  background: #fff6e9; border-radius: 999px; padding: 4px 10px;
}
/* 窄屏：宠物区放大居中，数值条占满整行。断点拉到 520，提前转竖排避免右侧按钮撑出 */
@media (max-width: 520px) {
  .pet-wrap { flex-direction: column; align-items: stretch; }
  .pet-stage { width: 100%; max-width: 280px; margin: 0 auto; height: 220px; }
}

.bar { height: 14px; border-radius: 999px; background: #f2e6d6; overflow: hidden; border: 2px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffc445, #ff8a3d); transition: width .5s cubic-bezier(.3,1.3,.5,1); }
.bar.xp > i { background: linear-gradient(90deg, #8ee7ff, #4aa8ff); }
.bar .lbl { font-size: 11px; font-weight: 900; color: var(--ink-soft); margin-bottom: 4px; display: block; }

/* ---------- word card ---------- */
.wordcard { text-align: center; position: relative; } /* 翻词箭头以整卡为定位上下文，居中在卡片中部 */
/* 配图 + 两侧翻词箭头的定位层（箭头用整卡做定位上下文，这里不必设 relative） */
.wc-stage { }
.wc-nav {
  position: absolute; top: 50%; margin-top: -21px; z-index: 3;
  width: 42px; height: 42px; border-radius: 50%;
  border: 2px solid var(--line); background: rgba(255,255,255,.94);
  color: var(--brand-dk); display: grid; place-items: center;
  cursor: pointer; padding: 0;
  box-shadow: 0 3px 0 rgba(58,44,34,.1);
  transition: transform .12s, box-shadow .12s, opacity .2s, border-color .2s;
}
.wc-nav.prev { left: 10px; }
.wc-nav.next { right: 10px; }
.wc-nav svg {
  width: 22px; height: 22px; fill: none; stroke: currentColor;
  stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round;
}
.wc-nav:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(58,44,34,.1); }
.wc-nav.off { opacity: .3; }
.wc-visual {
  width: 150px; height: 150px; margin: 4px auto 10px; border-radius: 30px;
  display: grid; place-items: center; position: relative;
  background: linear-gradient(160deg, #fff6e6, #ffead2);
  border: 3px solid #ffd9ae;
  box-shadow: inset 0 -10px 0 rgba(255,255,255,.7);
}
.wc-visual .em { font-size: 76px; line-height: 1; }
.wc-visual .glyph {
  position: absolute; right: -6px; bottom: -6px;
  background: var(--brand); color: #fff; font-weight: 900; font-size: 20px;
  min-width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center;
  border: 3px solid #fff;
}
.wc-word { font-size: 42px; font-weight: 900; letter-spacing: .5px; line-height: 1.1; word-break: break-word; }
.wc-ipa { color: var(--ink-soft); font-size: 16px; font-weight: 700; margin-top: 2px; }
.wc-cn { font-size: 22px; font-weight: 800; color: var(--brand-dk); margin-top: 8px; }

.speak-btn {
  width: 62px; height: 62px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--blue); color: #fff; font-size: 27px;
  box-shadow: 0 5px 0 #2f8ce0; display: grid; place-items: center;
}
.speak-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f8ce0; }
.speak-btn.sm { width: 44px; height: 44px; font-size: 21px; box-shadow: 0 3px 0 #2f8ce0; }

/* ---------- learn: 跟读命中条 + 录音状态 ---------- */
.hits-row { display: flex; gap: 6px; align-items: center; }
.hits-row .hit {
  width: 28px; height: 12px; border-radius: 999px;
  background: #f2e6d6; border: 1.5px solid var(--line);
  transition: background .25s, transform .25s;
}
.hits-row .hit.on {
  background: linear-gradient(90deg, var(--green), var(--brand));
  border-color: var(--green-dk);
  transform: scale(1.08);
}
/* ---------- learn: 跟读主卡 ---------- */
/* 允许纵向滚动、横向留给滑动切词 */
.learn-swipe { touch-action: pan-y; position: relative; }
/* 跟手期间不能有过渡，否则位移会滞后于手指 */
.learn-swipe.dragging { transition: none !important; }
.learn-swipe.passed { border-color: var(--green); background: linear-gradient(180deg, #f3fdf7, #fff); }
.learn-swipe.card-in-r { animation: card-in-r .26s cubic-bezier(.22,.9,.3,1) both; }
.learn-swipe.card-in-l { animation: card-in-l .26s cubic-bezier(.22,.9,.3,1) both; }
@keyframes card-in-r {
  from { transform: translateX(34px) rotate(3deg); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
@keyframes card-in-l {
  from { transform: translateX(-34px) rotate(-3deg); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

/* 状态行：随录音/进度变化的唯一一处提示，替代原来两行静态说明 */
.learn-status {
  margin-top: 12px; text-align: center; font-weight: 800; font-size: 13px;
  color: var(--ink-soft); min-height: 19px;
}
.learn-status.ok { color: var(--green-dk); font-size: 15px; }

/* 听（🔊🐢）和说（🎤）是同一条动作链，并排一行。
   左右两个「听」的按钮严格同尺寸，中间「说」的最大 —— 主次一眼可辨。 */
.learn-action {
  display: flex; align-items: center; justify-content: center;
  gap: 22px; margin-top: 10px;
}
.learn-action .speak-btn,
.learn-action .speak-btn.sm {
  width: 58px; height: 58px; font-size: 26px;
  box-shadow: 0 4px 0 #2f8ce0;
}
.learn-action .mic-btn { width: 88px; height: 88px; font-size: 40px; }
/* 底部小字：只交代翻页方式，不重复状态行 */
.learn-tip {
  margin-top: 12px; text-align: center;
  font-size: 11px; font-weight: 700; color: var(--ink-soft);
}
.mic-btn {
  width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
  font-size: 38px; color: #fff; display: grid; place-items: center;
  background: linear-gradient(160deg, #ffb25c, var(--brand));
  box-shadow: 0 6px 0 var(--brand-dk), 0 12px 20px rgba(242,106,18,.28);
  transition: transform .12s, box-shadow .12s, background .2s;
}
.mic-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-dk); }
.mic-btn.self { background: linear-gradient(160deg, #6fd9a3, var(--green)); box-shadow: 0 6px 0 var(--green-dk); }
.mic-btn.rec {
  background: linear-gradient(160deg, #ff8f85, var(--red));
  box-shadow: 0 6px 0 #c2362e;
  animation: mic-pulse 1.1s ease-in-out infinite;
}
@keyframes mic-pulse {
  0%,100% { transform: scale(1); box-shadow: 0 6px 0 #c2362e, 0 0 0 0 rgba(242,84,75,.45); }
  50% { transform: scale(1.06); box-shadow: 0 7px 0 #c2362e, 0 0 0 14px rgba(242,84,75,0); }
}
.learn-nomic {
  display: flex; align-items: center; gap: 9px;
  background: #fff6e9; border: 2px solid #ffe2b8; border-radius: 14px;
  padding: 8px 10px; font-size: 12px; font-weight: 700; margin-top: 10px; text-align: left;
}
.learn-nomic > span { flex: 1; }
.nomic-re {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid #e8b45c; background: #fff; cursor: pointer;
  font-size: 14px; line-height: 1; display: inline-flex;
  align-items: center; justify-content: center;
}
.nomic-re:active { transform: scale(.88); }

/* 头两次进页面：卡片轻轻左右晃一下，暗示「可以这么滑」。
   动画里改 transform，所以一触摸就摘掉 class（见 app.js touchstart）。 */
.learn-swipe.swipe-hint { animation: swipe-hint 1.3s ease-in-out both; }
@keyframes swipe-hint {
  0%   { transform: translateX(0) rotate(0deg); }
  14%  { transform: translateX(-10px) rotate(-1.4deg); }
  31%  { transform: translateX(9px) rotate(1.3deg); }
  47%  { transform: translateX(-6px) rotate(-0.9deg); }
  62%  { transform: translateX(4px) rotate(0.6deg); }
  78%  { transform: translateX(-2px) rotate(-0.3deg); }
  100% { transform: translateX(0) rotate(0deg); }
}
/* 晃的同时让右边那个箭头鼓一下，视线自然跟过去 */
.learn-swipe.swipe-hint .wc-nav.next { animation: nav-nudge 1.3s ease-in-out both; }
@keyframes nav-nudge {
  0%, 100% { transform: scale(1); border-color: var(--line); }
  31% { transform: scale(1.14); border-color: var(--brand); color: var(--brand); }
  62% { transform: scale(1.06); border-color: var(--brand); color: var(--brand); }
}
/* 次卡：整卡可点的翻词库入口 */
.browse-entry {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
  font-family: var(--font); font-size: 14px; font-weight: 800; color: inherit;
}

/* ---------- phonics ---------- */
.pindu { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pindu button {
  border: 2px solid var(--line); background: #fff; border-radius: 14px;
  padding: 7px 12px; cursor: pointer; font-family: var(--font);
  display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 52px;
  box-shadow: 0 3px 0 rgba(58,44,34,.07);
}
.pindu button:active { transform: translateY(2px); box-shadow: none; }
.pindu .letters { font-weight: 900; font-size: 19px; color: var(--purple); }
.pindu .sound { font-size: 13px; color: var(--ink-soft); font-weight: 800; }
.pindu button.playing { background: #f3e9ff; border-color: #d9bcff; }

/* ---------- quiz ---------- */
.q-progress { display: flex; gap: 5px; margin-bottom: 12px; }
.q-progress i { flex: 1; height: 8px; border-radius: 999px; background: #f0e2cf; }
.q-progress i.ok { background: var(--green); }
.q-progress i.no { background: var(--red); }
.q-progress i.cur { background: var(--brand); }

.q-prompt { text-align: center; font-size: 15px; color: var(--ink-soft); font-weight: 800; margin-bottom: 8px; }
.q-big { text-align: center; font-size: 40px; font-weight: 900; margin: 6px 0 14px; word-break: break-word; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.opt {
  border: 3px solid var(--line); background: #fff; border-radius: 20px;
  padding: 14px 10px; cursor: pointer; font-family: var(--font);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  box-shadow: 0 4px 0 rgba(58,44,34,.08); transition: transform .1s;
  color: var(--ink); min-height: 92px; justify-content: center;
}
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58,44,34,.08); }
.opt .em { font-size: 42px; line-height: 1; }
.opt .tx { font-weight: 900; font-size: 19px; }
.opt .sub { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.opt .glyph-badge {
  background: var(--purple); color: #fff; font-weight: 900; font-size: 16px;
  min-width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center;
}
.opt.right { border-color: var(--green); background: #eafaf1; }
.opt.wrong { border-color: var(--red); background: #fdecea; }
.opt.dim { opacity: .4; }

.feedback {
  margin-top: 14px; border-radius: 18px; padding: 13px 15px; font-weight: 800;
  display: flex; align-items: center; gap: 10px; font-size: 15px;
}
.feedback.ok { background: #eafaf1; border: 2px solid var(--green); color: #14603c; }
.feedback.no { background: #fdecea; border: 2px solid var(--red); color: #8d231c; }
.feedback .ic { font-size: 24px; }

/* 作答后才揭晓的「图 + 词形 + 词义」对照卡 */
.reveal {
  margin-top: 11px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
  border: 2px dashed var(--line); border-radius: 16px; background: #fffdf9;
}
.rv-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px; cursor: pointer;
  background: #fff; border: 2px solid var(--line); border-radius: 13px; font-weight: 800;
}
.rv-row:active { transform: translateY(2px); }
.rv-row.on { border-color: var(--green); background: #eafaf1; }
.rv-row .em { font-size: 23px; line-height: 1; }
.rv-row .w { font-size: 17px; }
.rv-row .m { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
.rv-row .rv-sp { font-size: 15px; opacity: .55; }

/* ---------- sentences ---------- */
.unit-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.unit-chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; border: 2px solid var(--line); background: #fff; border-radius: 999px;
  padding: 8px 15px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: var(--font); color: var(--ink);
}
.chip.on { background: var(--brand); color: #fff; border-color: var(--brand-dk); }

.sent-list { display: flex; flex-direction: column; gap: 8px; }
.sent {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  border: 2px solid var(--line); border-radius: 16px; background: #fff; cursor: pointer;
}
.sent.playing { border-color: var(--blue); background: #eff7ff; }
.sent .idx { font-size: 11px; color: var(--ink-soft); font-weight: 900; padding-top: 3px; min-width: 18px; }
.sent .body { flex: 1; min-width: 0; }
.sent .en { font-size: 17px; font-weight: 800; line-height: 1.45; }
.sent .zh { font-size: 13px; color: var(--ink-soft); font-weight: 700; margin-top: 2px; }
.stok {
  display: inline-block; padding: 1px 2px; border-radius: 6px; cursor: pointer;
}
.stok.hit { background: #fff0d6; box-shadow: inset 0 -2px 0 var(--yellow); }
.stok.known { box-shadow: inset 0 -2px 0 var(--green); }

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  background: #fff; border: 2px solid var(--line); border-radius: 18px;
  padding: 12px 8px; text-align: center;
}
.stat .v { font-size: 26px; font-weight: 900; line-height: 1.1; }
.stat .k { font-size: 11px; color: var(--ink-soft); font-weight: 800; margin-top: 3px; }

.heat { display: flex; gap: 4px; flex-wrap: wrap; }
.heat i {
  width: 26px; height: 26px; border-radius: 8px; background: #f2e6d6;
  border: 2px solid var(--line); display: grid; place-items: center;
  font-size: 9px; font-style: normal; font-weight: 900; color: var(--ink-soft);
}
.heat i.l1 { background: #ffe9b8; border-color: #ffd98a; }
.heat i.l2 { background: #ffc973; border-color: #f5ab3d; }
.heat i.l3 { background: #ff9f45; border-color: #e87f1f; color: #fff; }
.heat i.l4 { background: #f26a12; border-color: #c95208; color: #fff; }

.wtable { display: flex; flex-wrap: wrap; gap: 7px; }
.wpill {
  border: 2px solid var(--line); background: #fff; border-radius: 12px;
  padding: 6px 10px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 5px;
}
.wpill .dot { width: 9px; height: 9px; border-radius: 50%; background: #e6d6c2; }
.wpill.b1 .dot { background: #ffb36b; } .wpill.b1 { border-color: #ffd7ae; }
.wpill.b2 .dot { background: #ffd166; } .wpill.b2 { border-color: #ffe6a3; }
.wpill.b3 .dot { background: #9be36d; } .wpill.b3 { border-color: #c7f0a8; }
.wpill.b4 .dot { background: #4fd18b; } .wpill.b4 { border-color: #a5ecca; }
.wpill.b5 .dot { background: #22b573; } .wpill.b5 { border-color: #8ce0bb; }

/* ---------- misc ---------- */
.center { text-align: center; }
.muted { color: var(--ink-soft); font-size: 13px; font-weight: 700; }
.hidden { display: none !important; }
.empty { text-align: center; padding: 30px 10px; color: var(--ink-soft); font-weight: 800; }
.empty .ic { font-size: 46px; display: block; margin-bottom: 8px; }

.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
  background: #3a2c22; color: #fff; padding: 11px 20px; border-radius: 999px;
  font-weight: 800; font-size: 14px; opacity: 0; transition: .25s; z-index: 90; pointer-events: none;
  max-width: 88vw; text-align: center;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

.rec-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  background: var(--red); margin-right: 6px; animation: blink 1s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

.score-ring { display: grid; place-items: center; }
.score-ring .n { font-size: 34px; font-weight: 900; }

@media (max-width: 400px) {
  .wc-word { font-size: 34px; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .opts { gap: 8px; }
}
@media (min-width: 720px) {
  #app { padding-bottom: 120px; }
}

/* ---------- phonics 专项 ---------- */
.segbar {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px;
  -webkit-overflow-scrolling: touch;
}
.segbar .seg {
  flex: 0 0 auto; border: 2px solid var(--line); background: #fff; border-radius: 999px;
  padding: 7px 13px; font-size: 13px; font-weight: 800; color: var(--ink-soft);
}
.segbar .seg.on { background: var(--brand); border-color: var(--brand-dk); color: #fff; }

/* 字素配色（与课本词卡一致） */
.pb-tag-c  { --pc: #4aa8ff; --pcd: #2b7fd4; }  /* 辅音字母 */
.pb-tag-v  { --pc: #ff6f91; --pcd: #e14a70; }  /* 元音字母 */
.pb-tag-ct { --pc: #8e6ff2; --pcd: #6f4fd6; }  /* 辅音组合 */
.pb-tag-vt { --pc: #f2a03d; --pcd: #d97f1a; }  /* 元音组合 */
.pb-tag-r  { --pc: #2fb9a8; --pcd: #1d9184; }  /* r 控元音 */
.pb-tag-s  { --pc: #9aa3ad; --pcd: #7c858f; }  /* 不发音 */

.phonics-blocks { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
.phonics-blocks .pb {
  border: none; border-radius: 10px; padding: 8px 12px; cursor: pointer;
  background: var(--pc, var(--brand)); color: #fff; box-shadow: 0 3px 0 var(--pcd, var(--brand-dk));
  transition: transform .12s;
}
.phonics-blocks .pb:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--pcd, var(--brand-dk)); }
.phonics-blocks .pb .l { font-size: 19px; font-weight: 900; letter-spacing: 1px; }
.phonics-blocks .pb.playing { animation: pb-pop .55s; }
@keyframes pb-pop { 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }

.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 9px; margin-top: 10px; }
.ph-card {
  border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
}
.ph-card.done { border-color: var(--green); background: #f0fbf5; }
.ph-card .l, .ph-opt .l, .ph-ask-letter, .slot .l {
  font-weight: 900; background: var(--pc, var(--brand)); color: #fff;
  border-radius: 8px; padding: 3px 9px; letter-spacing: 1px;
}
.ph-card .l { font-size: 19px; }
.ph-card .w { font-size: 11px; color: var(--ink-soft); font-weight: 700; }

.speak-btn.big { width: 84px; height: 84px; font-size: 40px; margin: 4px auto 0; display: block; }
.ph-ask-letter { display: inline-block; font-size: 40px; padding: 8px 22px; }
.ph-ask-wrap { text-align: center; }

.ph-opt {
  border: 2px solid var(--line); background: #fff; border-radius: 12px;
  min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; font-size: 20px; transition: transform .1s;
}
.ph-opt .sp { font-size: 24px; }
.ph-opt:active { transform: scale(.96); }
.ph-opt.playing { animation: pb-pop .55s; }
.ph-opt.right { border-color: var(--green); background: #e9faf1; }
.ph-opt.wrong { border-color: var(--red); background: #feecec; }

.ph-build-slots { display: flex; justify-content: center; gap: 7px; margin: 4px 0 12px; flex-wrap: wrap; }
.ph-build-slots .slot {
  min-width: 46px; height: 46px; border-radius: 10px; border: 2px dashed var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; color: var(--ink-soft); font-size: 16px; background: #fafafa;
}
.ph-build-slots .slot.filled { border-style: solid; border-color: var(--pc, var(--brand)); }

/* ---------- home 今日任务清单 ---------- */
.plan-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.plan-item {
  display: flex; align-items: center; gap: 10px; text-align: left;
  border: 2px solid var(--line); background: #fff; border-radius: 14px;
  padding: 10px 12px; cursor: pointer; transition: transform .12s, border-color .2s;
}
.plan-item:active { transform: scale(.98); }
.plan-item.done { background: #f4fbf6; border-color: #cdeeda; }
.plan-item.done .pi-title { color: var(--ink-soft); text-decoration: line-through; text-decoration-thickness: 2px; }
.pi-check {
  width: 24px; height: 24px; flex: 0 0 auto; border-radius: 999px;
  border: 2px solid var(--line); display: grid; place-items: center;
  font-weight: 900; font-size: 14px; color: #fff; background: #fff;
}
.plan-item.done .pi-check { background: var(--green); border-color: var(--green); }
.pi-ic { font-size: 22px; flex: 0 0 auto; }
.pi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pi-title { font-weight: 900; font-size: 15px; }
.pi-why { font-size: 11px; color: var(--ink-soft); font-weight: 700; margin-top: 1px; }
.pi-badge {
  flex: 0 0 auto; font-weight: 900; font-size: 12px;
  background: var(--bg, #fff6e9); border: 2px solid var(--line);
  border-radius: 999px; padding: 4px 10px;
}
.plan-item.done .pi-badge { background: #e9faf1; border-color: #cdeeda; color: #1d7a4f; }

/* ---------- 设置弹层 ---------- */
.pill-btn { cursor: pointer; font-family: var(--font); }
.modal-ov {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(58, 44, 34, .45);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade-in .18s ease;
}
.modal-sheet {
  width: 100%; max-width: 860px; max-height: 88vh; overflow-y: auto;
  /* 手机浏览器/WebView 里 vh 含地址栏高度，88vh 常超出可视区导致底部内容滚不到，用 dvh 兜底 */
  max-height: 88dvh;
  background: var(--bg);
  border-radius: 26px 26px 0 0;
  padding: 14px 14px calc(26px + env(safe-area-inset-bottom));
  animation: sheet-up .24s cubic-bezier(.3, 1.1, .5, 1);
  -webkit-overflow-scrolling: touch;
}
@keyframes fade-in { from { opacity: 0; } }
@keyframes sheet-up { from { transform: translateY(48px); opacity: .4; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 12px; }
.modal-x {
  width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line);
  background: #fff; font-size: 15px; font-weight: 900; cursor: pointer;
  color: var(--ink); font-family: var(--font);
}
.bk-row {
  display: flex; align-items: center; gap: 8px;
  border: 2px solid var(--line); background: #fff; border-radius: 16px;
  padding: 10px 12px; margin-bottom: 8px;
}
.bk-row.on { border-color: var(--brand); background: #fff7ee; }
.bk-em { font-size: 26px; flex: 0 0 auto; }
.bk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; font-size: 15px; }

/* 宠物图鉴 */
.pet-gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 4px; }
.pg-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border: 2px solid var(--line); background: #fff; border-radius: 16px;
  padding: 10px 4px 9px; font-size: 13px; text-align: center;
}
.pg-item.now { border-color: var(--green); background: #f0fbf5; }
.pg-cvwrap {
  width: 66px; height: 66px; cursor: pointer; border-radius: 14px;
  background: linear-gradient(165deg, #d9f4ff 0%, #ffe9f3 100%);
  border: 2px solid var(--line);
  display: grid; place-items: center;
  /* pet-idle 是给 home 页绝对定位精灵用的（keyframes 含 translate(-50%) 居中位移），
     套在图鉴 grid 上会把整框平移出格子；这里用无位移的轻微上下浮动 */
  animation: pg-bob 2.8s ease-in-out infinite;
}
@keyframes pg-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.pg-cvwrap:active { transform: scale(.94); }
.pg-cvwrap canvas { width: 54px; height: 54px; image-rendering: pixelated; display: block; }
@media (max-width: 400px) { .pet-gallery { grid-template-columns: repeat(2, 1fr); } }
/* 状态试验台：预览画布比图鉴格大一号；精灵一览芯片内的 canvas 保持硬边 */
.tb-main { width: 96px; height: 96px; animation: none; }
.tb-main canvas { width: 84px; height: 84px; image-rendering: pixelated; display: block; }
.tb-chip { display: inline-flex; align-items: center; padding: 4px 7px; }
.tb-chip canvas { image-rendering: pixelated; display: block; }

/* ---------- pet rich animations: 常驻基调(数值驱动) + 即时表演(交互) + 特效 ---------- */
/* 常驻基调类：infinite，覆盖默认 pet-idle；超跃/打瞌睡/低落三态互斥切换（JS 维护布尔独占） */
.pet-canvas-wrap.base-drowsy { animation: pet-drowsy 4.8s ease-in-out infinite; }
.pet-canvas-wrap.base-hyper  { animation: pet-wander 6.5s ease-in-out infinite; }
.pet-canvas-wrap.base-low    { animation: pet-droop 4s ease-in-out infinite; }
/* 即时表演类：一次性，播完被 JS 移除、回落常驻 */
.pet-canvas-wrap.wash  { animation: pet-sway .95s ease; }
.pet-canvas-wrap.dance { animation: pet-dance 1.4s ease; }
.pet-canvas-wrap.prop  { animation: pet-prop .85s ease; }
.pet-canvas-wrap.poop  { animation: pet-grunt .75s ease; }

@keyframes pet-wander {
  0%,100% { transform: translateY(0) scale(1); }
  15%  { transform: translate(-16px, -3px) scale(.98,1.03); }
  45%  { transform: translate(6px, 0)    scale(1); }
  70%  { transform: translate(28px, -4px) scale(.98,1.03); }
}
@keyframes pet-drowsy {
  0%,100% { transform: translateY(0); }
  30% { transform: translateY(6px) scale(1,.97); }
  55% { transform: translateY(-1px) scale(1,1.03); }
  80% { transform: translateY(5px); }
}
@keyframes pet-droop {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(3px); }
}
@keyframes pet-sway {
  0%,100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-3px) rotate(-7deg); }
  75% { transform: translateY(-3px) rotate(7deg); }
}
@keyframes pet-dance {
  0%,100% { transform: translateY(0) rotate(0) scale(1); }
  20% { transform: translateY(-18px) rotate(-8deg) scale(1.08); }
  40% { transform: translateY(-2px) rotate(6deg) scale(.98); }
  60% { transform: translateY(-18px) rotate(8deg) scale(1.08); }
  80% { transform: translateY(-1px) rotate(-5deg) scale(1); }
}
@keyframes pet-prop {
  0%,100% { transform: translateY(0) scale(1) rotate(0); }
  30% { transform: translateY(-12px) scale(1.12) rotate(-6deg); }
  60% { transform: translateY(-2px) scale(.94) rotate(5deg); }
}
@keyframes pet-grunt {
  0%,100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(4px) rotate(-5deg); }
  50% { transform: translateY(-4px) rotate(4deg); }
  75% { transform: translateY(4px) rotate(-5deg); }
}
/* 行走步态：走路期间由 JS 加 .walking（会覆盖常驻基调），到位后移除回落 */
.pet-canvas-wrap.walking { animation: pet-step .42s ease-in-out infinite; }
@keyframes pet-step {
  0%,100% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-5px) scale(1.02,.96); }
  60% { transform: translateY(0) scale(1); }
  80% { transform: translateY(-4px) scale(.99,1.02); }
}

/* 通用浮动特效（音符/泡泡/爱心/道具/梦境泡）；饭盆用 food-drop 从天而降。
   特效本体是像素精灵 canvas（原生尺寸绘制、CSS 3x 放大），pixelated 保持硬边 */
.fx {
  position: absolute; bottom: 60%; font-size: 20px; z-index: 2;
  pointer-events: none; animation: float-up 1.05s ease-out forwards;
}
canvas.fx, .pet-poop canvas { display: block; image-rendering: pixelated; }
.fx.food-drop { top: 26%; bottom: auto; font-size: 26px; animation: food-fall 1.55s ease forwards; }
@keyframes food-fall {
  0% { opacity: 0; transform: translateY(-24px) scale(.7); }
  25% { opacity: 1; }
  75% { opacity: 1; }
  100% { opacity: 0; transform: translateY(58px) scale(1); }
}

/* 便便：落在舞台下部，可点击清理（清理得 clean+mood；不清会用 petDecay 加速掉清洁） */
.pet-poop {
  position: absolute; bottom: 34px; padding: 0; border: 0; background: none;
  font-size: 17px; line-height: 1; cursor: pointer; z-index: 2;
  animation: poop-bounce 1.3s ease-in-out infinite;
}
@keyframes poop-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">🐲</span><span>皮克学英语</span></div>
    <div class="spacer"></div>
    <div class="pill" id="book-pill">📗 一上</div>
    <button class="pill pill-btn" id="btn-settings" title="设置">⚙️</button>
  </div>
  <div id="view"></div>
</div>
<nav class="tabbar" id="tabbar"></nav>

  function xpNeed(level) { return 40 + (level - 1) * 30; }
  /* drop：获得宠物素材 'food' 🍖（学单词）/ 'toy' 🎾（拼读）/ 'soap' 🧼（闯关） */
  function gainXp(n, drop, mood) {
    if (mood) gainMood(mood);
    S.pet.xp += n;
    if (drop) S.pet[drop] = (S.pet[drop] || 0) + 1;
    while (S.pet.xp >= xpNeed(S.pet.level)) {
      S.pet.xp -= xpNeed(S.pet.level);
      S.pet.level++;
      toast('🎉 ' + S.pet.name + ' 升到 ' + S.pet.level + ' 级啦！');
      beep('ok');
    }
    save();
  }

  function feedPet() {
    petDecay();
    if (S.pet.food <= 0) { toast('还没有食物，先完成今日任务赚 🍖 吧！'); return; }
    S.pet.food--; S.pet.fedTotal++;
    S.pet.sati = clamp(S.pet.sati + 28, 0, 100);
    gainXp(2, 0, 6);
    beep('tap');
    playAction('eat', 'eat', 1500); addFoodBowl(); spawnFx('meat', 1);
    renderHome();
  }

  function playPet() {
    petDecay();
    var now = Date.now();
    if (S.pet.toy <= 0) { toast('没有玩具了，去拼读练习赚 🎾 吧！'); return; }
    if (S.pet.sati < 15) { toast('饿得没力气玩了，先喂点吃的吧 🍖'); playAction('sad', 'sad', 900); return; }
    if (S.pet.lastPlay && now - S.pet.lastPlay < 90000) {
      toast('玩累啦，休息 ' + Math.ceil((90000 - (now - S.pet.lastPlay)) / 1000) + ' 秒再来～');
      return;
    }
    S.pet.lastPlay = now;
    S.pet.toy--;
    S.pet.sati = clamp(S.pet.sati - 4, 0, 100);
    gainXp(3, 0, 18);
    beep('ok');
    playFunRandom();
    renderHome();
  }

  function washPet() {
    petDecay();
    if (S.pet.soap <= 0) { toast('没有香皂了，去闯关赚 🧼 吧！'); return; }
    S.pet.soap--;
    S.pet.clean = clamp(S.pet.clean + 35, 0, 100);
    gainXp(2, 0, 4);
    beep('tap');
    playAction('wash', 'wash', 1600); spawnFx('bubble', 5);
    renderHome();
  }

  function touchPet() {
    var t = today();
    if (S.pet.petsDate !== t) { S.pet.petsDate = t; S.pet.petsToday = 0; }
    if (S.pet.petsToday >= 8) { toast('它被摸得毛都平啦，明天再来～'); return; }
    S.pet.petsToday++;
    gainXp(0, 0, 4);
    beep('tap');
    playAction('happy', 'happy', 700); spawnFx('heart', 1);
  }

  function petMood() {
    var m = S.pet.mood, sa = S.pet.sati, cl = S.pet.clean;
    if (sa < 15) return { face: '\u{1F62B}', say: '肚子好饿…快喂我吧 🍖' };
    if (cl < 15) return { face: '\u{1F922}', say: '身上黏黏的，帮我洗个澡吧 🧼' };
    if (m < 20) return { face: '\u{1F622}', say: '好无聊啊，陪我玩一会儿吧～' };
    if (sa < 40) return { face: '\u{1F615}', say: '有点饿了，学单词就能赚吃的哦' };
    if (cl < 40) return { face: '\u{1F615}', say: '想洗个香香的澡，闯关就能赚 🧼 哦' };
    if (m < 45) return { face: '\u{1F641}', say: '想玩了…摸摸我或者去拼读赚 🎾 吧！' };
    if (sa >= 75 && m >= 75 && cl >= 75) return { face: '\u{1F604}', say: '今天也要加油学英语呀！' };
    return { face: '\u{1F642}', say: '状态不错，继续加油！' };
  }

  function distractors(word, n) {
    var pool = currentBookWords().filter(function (w) { return w !== word; });
    if (pool.length < n) pool = Object.keys(WORDS).filter(function (w) { return w !== word; });
    var vw = visualOf(word).emoji;
    var diff = shuffle(pool.filter(function (w) { return visualOf(w).emoji !== vw; }));
    var same = shuffle(pool.filter(function (w) { return visualOf(w).emoji === vw; }));
    var out = diff.slice(0, n), i = 0;
    while (out.length < n && i < same.length) out.push(same[i++]);
    while (out.length < n) out.push(pick(pool));
    return out;
  }

  function makeQuestion(word) {
    var modes = ['en2pic', 'pic2en', 'listen2en', 'en2cn', 'cn2en'];
    var mode = pick(modes);
    var opts = shuffle([word].concat(distractors(word, 3)));
    return { word: word, mode: mode, opts: opts };
  }

  function buildQueue(kind) {
    var book = S.settings.book;
    var due = dueWords(book);
    var goal = Math.max(5, S.settings.dailyGoal);
    var pool;
    if (kind === 'new') {
      var unseen = currentBookWords().filter(function (w) { var st = S.words[w]; return !st || !st.seen; });
      pool = unseen.length ? unseen : (due.length ? due : currentBookWords());
    } else if (kind === 'review') {
      pool = due.length ? due : currentBookWords();
    } else {
      pool = due.length ? due : currentBookWords();
    }
    var q = shuffle(pool).slice(0, Math.max(goal, 10)).map(makeQuestion);
    quiz.queue = q; quiz.idx = 0; quiz.results = []; quiz.sessionStart = Date.now();
  }

  /* ---------------- views ---------------- */
  var TABS = [
    { id: 'home', label: '首页', ic: '🏠' },
    { id: 'learn', label: '学单词', ic: '📖' },
    { id: 'phonics', label: '拼读', ic: '🔤' },
    { id: 'play', label: '闯关', ic: '🎮' },
    { id: 'stats', label: '统计', ic: '📊' }
  ];
  var tab = 'home';

  function renderTabs() {
    var bar = $('#tabbar');
    bar.innerHTML = '';
    TABS.forEach(function (t) {
      var b = el('button', 'tab' + (tab === t.id ? ' on' : ''),

  function go(id) {
    /* 摇晃提示按「进入学单词 tab」计次，不按卡片重绘计次（跟读一次就会重绘） */
    if (id === 'learn' && tab !== 'learn') armSwipeHint();
    /* 离开学单词 tab：停掉可能还在录的识别器（含下载中/录音中），防切走后串台 */
    if (tab === 'learn' && id !== 'learn') abandonLearnMic();
    stopAudio();
    tab = id;
    renderTabs();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });

  function render() {
    var v = $('#view');
    v.innerHTML = '';
    var pill = $('#book-pill');
    if (pill) pill.textContent = BOOK_META[S.settings.book].emoji + ' ' + BOOK_META[S.settings.book].short;
    if (tab === 'home') renderHome(v);
    else if (tab === 'learn') renderLearn(v);
    else if (tab === 'phonics') renderPhonics(v);
    else if (tab === 'play') renderPlay(v);
    else if (tab === 'stats') renderStats(v);
  }

  /* ---------- HOME（今日计划 + 宠物）---------- */
  /* 数值条；action 为尾部操作按钮（如喂食/玩耍/洗澡），省略则只有条 */
  function barRow(label, val, cls, action) {
    return '<div class="bar-row">' +
      '<span class="lbl">' + label + '</span>' +
      '<div class="bar ' + (cls || '') + '"><i style="width:' + clamp(val, 0, 100) + '%"></i></div>' +
      (action || '') +
      '</div>';
  }

  /* 数值条尾部的照顾按钮。素材为 0 时弱化成描边样式，但仍可点击（点了会提示去哪赚） */
  function petAct(color, id, emoji, verb, n) {
    return '<button class="btn ' + (n > 0 ? color : 'ghost') + ' xs" id="btn-' + id + '">' +
      emoji + ' ' + verb + ' ' + n + '</button>';
  }

  /* 每日任务清单 —— 艾宾浩斯调度是核心引擎，首页只是它的呈现层 */
  function dailyPlan() {
    var due = dueWords(S.settings.book);
    var unseen = currentBookWords().filter(function (w) {
      var st = S.words[w]; return !st || !st.seen;
    });
    var d = dayStat();
    var answered = (d.right || 0) + (d.wrong || 0);
    var goal = S.settings.dailyGoal;
    var newCap = Math.min(goal, 8, unseen.length);
    var newDone = Math.min(d.newWords || 0, newCap);
    var phDone = Math.min(d.phonics || 0, 5);
    var petNeed = (S.pet.sati < 50 && S.pet.food > 0) ? 'feed'
      : (S.pet.sati < 15 ? 'food-missing'
        : (S.pet.clean < 40 && S.pet.soap > 0) ? 'wash'
          : (S.pet.clean < 15 ? 'soap-missing'
            : (S.pet.mood < 50 ? 'play' : null)));
    return [
      { ic: '🔁', title: '复习快忘的词', why: '快忘的时候复习，记得最牢（艾宾浩斯）',
        badge: due.length ? due.length + ' 个' : '✓', done: due.length === 0, go: 'review' },
      { ic: '📖', title: '学新词',
        badge: newCap === 0 ? '✓' : newDone + '/' + newCap,
        done: newCap === 0 || newDone >= newCap, go: 'new' },
      { ic: '🔤', title: '拼读练习', badge: phDone + '/5', done: phDone >= 5, go: 'phonics' },
      { ic: '🎮', title: '每日闯关', badge: Math.min(answered, goal) + '/' + goal, done: answered >= goal, go: 'quiz' },
      { ic: '🐾', title: '照顾宠物',
        badge: petNeed === 'feed' ? '饿了 🍖' : petNeed === 'wash' ? '要洗澡 🛁' : petNeed === 'play' ? '想玩了'
          : petNeed === 'food-missing' ? '没食物啦' : petNeed === 'soap-missing' ? '没香皂啦' : '✓',
        done: !petNeed, go: petNeed || 'pet-ok' }
    ];
  }

  function renderHome(v) {
    v = v || $('#view');
    v.innerHTML = '';
    updateStreak();
    petDecay();

    var d = dayStat();

    /* --- 宠物卡 --- */
